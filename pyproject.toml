[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-native-scamp"
version = "0.1.0"
description = "An MLX-native SCAMP-compatible matrix profile library for Apple Silicon."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "JimBoHa" }
]
dependencies = [
  "mlx>=0.23.2",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
distributed = [
  "grpcio>=1.62.3,<2",
  "protobuf>=4.25.3,<6",
]

[project.scripts]
scamp = "mlx_native_scamp.cli:main"
mlx-scamp = "mlx_native_scamp.cli:main"

[project.urls]
Homepage = "https://github.com/JimBoHa/MLX-native-SCAMP"
Repository = "https://github.com/JimBoHa/MLX-native-SCAMP"
Upstream = "https://github.com/zpzim/SCAMP"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mlx_native_scamp.distributed.proto" = ["*.proto"]
