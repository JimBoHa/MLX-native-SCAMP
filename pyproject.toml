[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-native-scamp"
version = "0.1.0"
description = "An MLX-native SCAMP-compatible matrix profile library for Apple Silicon."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "JimBoHa" }
]
dependencies = [
  "mlx>=0.23.2",
  "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/JimBoHa/MLX-native-SCAMP"
Repository = "https://github.com/JimBoHa/MLX-native-SCAMP"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
