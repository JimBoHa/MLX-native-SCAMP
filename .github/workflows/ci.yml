name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build '.[distributed]'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and smoke-test Python CLI artifacts
        run: |
          python -m build --sdist --wheel
          mkdir -p "$RUNNER_TEMP/sdist-source" "$RUNNER_TEMP/sdist-wheel"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          python -m build --wheel \
            --outdir "$RUNNER_TEMP/sdist-wheel" \
            "$RUNNER_TEMP"/sdist-source/*
          python -m venv --system-site-packages "$RUNNER_TEMP/cli-venv"
          "$RUNNER_TEMP/cli-venv/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP"/sdist-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cli-venv/bin/python" - <<'PY'
          from importlib.metadata import entry_points

          scripts = {
              entry.name: entry.value
              for entry in entry_points(group="console_scripts")
              if entry.name in {"scamp", "mlx-scamp"}
          }
          assert scripts == {
              "scamp": "mlx_native_scamp.cli:main",
              "mlx-scamp": "mlx_native_scamp.cli:main",
          }
          PY
          "$RUNNER_TEMP/cli-venv/bin/scamp" --help >/dev/null
          "$RUNNER_TEMP/cli-venv/bin/scamp" --list_variants >scamp-variants
          "$RUNNER_TEMP/cli-venv/bin/mlx-scamp" --list_variants \
            >mlx-scamp-variants
          cmp scamp-variants mlx-scamp-variants
          test "$(wc -l <scamp-variants)" -eq 41
          mkdir cli-smoke
          printf '0 1 0 2 0 1 0\n' >cli-smoke/input
          "$RUNNER_TEMP/cli-venv/bin/scamp" \
            --window=3 \
            --input_a_file_name=cli-smoke/input \
            --profile_type=1NN \
            --no_gpu \
            --output_a_file_name=cli-smoke/profile
          test "$(wc -l <cli-smoke/profile)" -eq 5

      - name: Configure native C++ library
        run: |
          MLX_DIR="$(python -c 'import mlx.core, pathlib; print(pathlib.Path(mlx.core.__file__).parent / "share/cmake/MLX")')"
          cmake -S . -B build/cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLX_DIR="$MLX_DIR"

      - name: Build native C++ library
        run: cmake --build build/cpp --parallel

      - name: Test native C++ library
        run: ctest --test-dir build/cpp --output-on-failure

      - name: Smoke-test installed native CLI
        run: |
          cmake --install build/cpp --prefix "$RUNNER_TEMP/mlx-scamp-install"
          MLX_LIB="$(python -c 'import mlx.core, pathlib; print(pathlib.Path(mlx.core.__file__).parent / "lib")')"
          DYLD_LIBRARY_PATH="$MLX_LIB" \
            "$RUNNER_TEMP/mlx-scamp-install/bin/mlx-scamp-native" --help >/dev/null
          DYLD_LIBRARY_PATH="$MLX_LIB" \
            "$RUNNER_TEMP/mlx-scamp-install/bin/mlx-scamp-native" --list_variants \
            | grep -F "backend=mlx-metal strategy=diagonal-recurrence"
          CLI_SMOKE="$RUNNER_TEMP/mlx-scamp-cli-smoke"
          mkdir -p "$CLI_SMOKE"
          printf '0 1 -1 2 0.5 -0.5 1.5 0.2\n' >"$CLI_SMOKE/input"
          DYLD_LIBRARY_PATH="$MLX_LIB" \
            "$RUNNER_TEMP/mlx-scamp-install/bin/mlx-scamp-native" \
              --window=3 \
              --input_a_file_name="$CLI_SMOKE/input" \
              --single_precision \
              --output_a_file_name="$CLI_SMOKE/profile" \
              --output_a_index_file_name="$CLI_SMOKE/index"
          test "$(wc -l <"$CLI_SMOKE/profile")" -eq 6
          test "$(wc -l <"$CLI_SMOKE/index")" -eq 6
          DYLD_LIBRARY_PATH="$MLX_LIB" \
            "$RUNNER_TEMP/mlx-scamp-install/bin/mlx-scamp-native" \
              --profile_type=1NN \
              --window=3 \
              --input_a_file_name="$CLI_SMOKE/input" \
              --single_precision \
              --output_a_file_name="$CLI_SMOKE/profile-no-index" \
              --output_a_index_file_name="$CLI_SMOKE/input"
          test "$(wc -l <"$CLI_SMOKE/profile-no-index")" -eq 6
